schema_version: pathbridger-state-experiment/v2
manifest_id: paper-main-and-completed-ablations
source:
  commit: 6a1806b5570e0a48f8999c821e910ec5210a7b2e
  paths:
    - scripts/cpu_eval_pbf_pathwt_ckpt.py
    - scripts/queue_paper_s0_pbf_pathwt.sh
    - scripts/queue_paper_s0_pbf_stoch.sh
    - scripts/sweep_jflow_prefix_m_eval.sh
    - scripts/sweep_jflow_prefix_mt_cpu_eval.sh
    - scripts/watch_cpu_eval_paper_s0_pbf_pathwt.sh
  notes: Launcher semantics come from 6a1806b; Main preset values are independently pinned per environment to the d0810 PBF and 850c PBG snapshots, never score-fitted. Host affinity, locks, polling, and nohup orchestration are intentionally excluded.
data:
  provider: OGBench
  representation: compact state observations, actions, and episode terminals
  training_split: <env_name>.npz
  validation_split: not used by the deleted state launchers
  actions_required: true
  dataset_dir: required runtime input
  source_snapshot_label: data300k
  source_snapshot_label_semantics: historical config-directory and run-group label; dataset content hash is unresolved
training_defaults:
  train_steps: 1000000
  batch_size: 1024
  eval_interval: 0
  save_interval: 100000
  extra_save_steps: []
  async_prefetch: true
aggregation_contract:
  episode_success: any info[success] within the episode
  task_success: arithmetic mean over episodes for that task
  overall_success: unweighted arithmetic mean of task success rates
  nt_grid_summary: mean and max of overall_success in manifest N/T order
  checkpoint_summary: no automatic cross-checkpoint mean; report in listed checkpoint order
  source_paths:
    - scripts/cpu_eval_pbf_pathwt_ckpt.py
