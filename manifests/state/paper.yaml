unresolved:
  - The deleted sources do not identify content hashes for OGBench datasets or an exact ogbench package build.
  - The exact historical run-directory names and checkpoint file hashes are runtime artifacts, not encoded in the launchers.
  - The full 19-cell grid is source-supported, but the deleted source alone does not prove which run/checkpoint grids completed.
  - Main run_group values come from each frozen config snapshot; launcher-level Main orchestration remains absent.
  - Several frozen YAMLs inherit seed 0 from main.py rather than spelling it out; the manifest records the resolved seed and does not claim an explicit YAML key.
