[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pathbridger"
version = "0.3.0"
description = "PathBridger for offline goal-conditioned reinforcement learning."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Soohyun Choi" },
    { name = "Seonvin Cho" },
    { name = "Songnam Hong" },
]
dependencies = [
    "absl-py",
    "flax>=0.8.4",
    "gymnasium>=0.29.1",
    "jax>=0.4.26",
    "ml-collections",
    "numpy>=1.26",
    "ogbench>=1.1,<1.3",
    "optax",
    "PyYAML>=6",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/SChoish/PathBridger"
Repository = "https://github.com/SChoish/PathBridger"
Paper = "https://arxiv.org/abs/2608.29061"

[project.scripts]
pathbridger-train = "main:run"
pathbridger-eval = "evaluate:run"
pathbridger-infer = "inference:run"

[project.optional-dependencies]
tracking = ["wandb"]

[tool.setuptools]
py-modules = ["main", "evaluate", "inference"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "configs*", "envs*", "utils*"]

[tool.setuptools.package-data]
configs = ["*.yaml"]

[tool.setuptools.data-files]
"share/pathbridger/assets" = ["assets/architecture.jpg"]
